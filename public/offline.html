<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2B3138" />
<title>Kumaar Industries — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2F3F5; color: #1B1F24;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 340px; margin: 24px; padding: 28px; background: #fff; border: 1px solid #DFE2E6; border-radius: 18px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: #6B7480; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  button { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #1F6FB5; color: #fff; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>The app needs the internet to show live orders and payments. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
